name: V0.7 Lost Road Demo Regression
on:
  push:
    branches:
      - visual/v0.6-fern-understory
      - feature/demo-lost-road
  pull_request:
    branches:
      - main
      - visual/v0.6-fern-understory
jobs:
  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: python -m pip install playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run narrative unit tests
        working-directory: app
        run: node tests/demo_story_test.js
      - name: Check Python test harness syntax
        working-directory: app
        run: python -m py_compile tests/regression_test.py tests/visual_capture.py
      - name: Run browser and ecology regressions
        working-directory: app
        run: python tests/regression_test.py
